[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoolgen"
version = "1.0.0"
description = "Procedural stool point clouds and compact generative models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stoolgen = "stoolgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

